- description: 규정 질문 응답에 '참고용(실제 법령 확인 필요)' 안내가 붙고 contexts에 doc_id가 regulations/로
    시작하는 청크가 포함된다
  semantic_ac_key: ac_eb9a684c65ba3806
- description: '요청마다 트레이스가 남는다: LANGSMITH_API_KEY가 있으면 LangSmith 프로젝트에, 없으면 로컬 JSONL
