  - name: Thread
    field_type: record
    description: thread_id 단위 대화 상태. SQLite 체크포인터에 메시지(원문), 직전 check_condition 결과(불가 강행 감지용), HITL
      interrupt 상태를 저장
  - name: JudgeResult
    field_type: record
    description: 'LLM Judge의 Pydantic 출력. traits({항목: 충족 여부}), forbidden({[판단] 항목: 위반 여부}), reason(str)'
  - name: TestQuery
    field_type: record
    description: evaluation/test_queries.csv 한 행. id, category(positive|negative|edge|guardrail),
      input, expected_traits, forbidden('[판단]' 접두사는 Judge 판정), expected_tools, note(thread/user/setup/setup_thread)
