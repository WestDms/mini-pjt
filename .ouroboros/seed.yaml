  semantic_ac_key: ac_8ef6d5ba0b858e25
ontology_schema:
  name: FishingTripAgentDomain
  description: 출조 Agent가 다루는 엔티티. data/ 파일 컬럼과 /query 인터페이스를 그대로 옮겼다(생성 후 수동 보완).
  fields:
  - name: Spot
    field_type: record
    description: 'data/spots.csv 한 행. spot_id(W01~J07), name, region(서해|남해|동해|제주), area, types(;구분:
      방파제|갯바위|선상|좌대), default_type, species_season(어종:시작월-끝월 ;구분)'
  - name: Forecast
    field_type: record
    description: 'data/forecast.csv 한 행. spot_id→Spot, date(2026-11-06~08), wind_ms, wave_m, advisory(없음|풍랑주의보|풍랑경보|태풍경보),
      tide(조금|중물|사리)'
  - name: Criteria
    field_type: record
    description: 'data/criteria.json. thresholds[형태][가능|주의]{wind_max,wave_max}, advisory_rules[특보][형태]→단계,
      tide_rules.사리{apply_to,downgrade}'
  - name: Verdict
    field_type: enum
    description: 가능 | 주의 | 불가. (Spot, date, 형태)에 대해 Criteria로 결정적으로 산출
  - name: Boat
    field_type: record
    description: 'data/boats.csv 한 행(boat_id+date 고유). boat_id(B01~B10), boat_name, port, spot_id→Spot,
      date, species, capacity, seats_left, price'
  - name: Reservation
    field_type: record
    description: book_boat 입력 boat_id, date, people, name, phone과 출력 reservation_no. 저장하지 않으며 응답·로그에서
      name·phone은 마스킹
  - name: RegulationChunk
    field_type: record
    description: data/regulations/*.md 청크. doc_id=regulations/<파일명>#<청크번호>, text
  - name: UserPreference
    field_type: record
    description: Store(namespace=user_id)에 저장되는 species, region, fishing_type
  - name: QueryRequest
    field_type: record
    description: POST /query 본문. question(필수), thread_id(선택), user_id(선택)
  - name: QueryResponse
    field_type: record
    description: answer(str), contexts([{doc_id, text}]), trace([{step, input, output}]).
      step ∈ guardrail_input | tool:<도구명> | guardrail_output | final | error
  - name: TestQuery
    field_type: record
    description: evaluation/test_queries.csv 한 행. id, category(positive|negative|edge|guardrail),
      input, expected_traits, forbidden('[판단]' 접두사는 Judge 판정), expected_tools, note(thread/user/setup/setup_thread)
evaluation_principles:
- name: settled_requirements
  description: Evaluate only the session-settled requirements.
  weight: 1.0
exit_conditions:
- name: settled_requirements_met
  description: All session-settled requirements are satisfied.
  criteria: Every listed acceptance criterion passes.
