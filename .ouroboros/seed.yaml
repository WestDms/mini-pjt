goal: '입문~중급 생활낚시인을 위한 출조 Agent를 만든다. 기능은 출조지 추천, 출조 가능 판정, 규정 RAG, 가상 선상 예약(HITL)이다.
  강의 산출물 규약(§4)과 필수 패턴(#1, #3, #11, #12)을 지켜 POST /query로 제공하고, 2차 자체 평가에서 15건 중 13건
  이상 통과한다.'
task_type: code
brownfield_context:
  project_type: brownfield
  context_references: []
  existing_patterns: []
  existing_dependencies: []
constraints:
- Python, LangChain, LangGraph, Amazon Bedrock ChatBedrockConverse(global.anthropic.claude-haiku-4-5-20251001-v1:0),
  langchain.agents.create_agent 사용. 임베딩은 Bedrock amazon.titan-embed-text-v2:0
- '이미 존재하는 파일은 사용만 하고 수정·재생성하지 않는다: data/spots.csv(spot_id,name,region,area,types,default_type,species_season),
  data/forecast.csv(spot_id,date,wind_ms,wave_m,advisory,tide), data/criteria.json,
  data/boats.csv(boat_id,boat_name,port,spot_id,date,species,capacity,seats_left,price),
  data/regulations/01~04 *.md, evaluation/test_queries.csv, SERVICE.md(완성본), CLAUDE.md,
  .gitignore는 항목 추가만 허용'
- '불변 기준: 커밋 81f684f에 들어 있는 data/와 evaluation/test_queries.csv가 기준이다. 이 PC는 core.autocrlf=true라서
  작업 트리 파일의 바이트 sha256은 줄바꿈 때문에 달라질 수 있으므로 파일 해시로 비교하지 않고 git 기준으로 비교한다'
- 새로 만드는 파일은 src/agent.py, src/tools.py, src/retriever.py, evaluation/run_eval.py,
  evaluation/round1_report.md, evaluation/round2_report.md, README.md, Dockerfile,
  run.sh, .env.example뿐이다. 실행 중 생기는 data/chroma/, *.sqlite, traces/*.jsonl은 허용하고 .gitignore에
  추가한다. .ouroboros/는 건드리지 않는다
- requirements.txt에는 기존 항목을 유지한 채 fastapi, uvicorn, ragas, langsmith만 추가한다
- '비밀 값은 .env에서 읽고 코드에 적지 않는다. .env.example 변수: AWS_DEFAULT_REGION, BEDROCK_MODEL_ID,
  EMBEDDING_MODEL_ID, TODAY=2026-11-06, EVAL_AUTO_APPROVE, LANGSMITH_API_KEY, LANGSMITH_PROJECT.
  현재 .env에는 AWS 자격증명과 리전만 있다'
- 함수와 도구에는 한국어 docstring을 쓴다
- TODAY=2026-11-06 고정, 오늘=D0·내일=D+1·모레=D+2, 날짜 없으면 D0. 2026-11-06~08 밖의 날짜는 도구가 거부하고
  고정 문구로 안내한다
- 1차와 2차 평가 사이에 test_queries.csv는 수정하지 않는다. 개선은 프롬프트·도구 로직·가드레일에서만 하고 변경 내용을 round2_report.md에
  적는다
- 실시간 API, 실제 예약 사이트, 결제, MCP 서버, Supervisor, Plan-Execute는 만들지 않는다
- 단일 create_agent에 도구 5개(recommend_spots, check_condition, search_regulation, find_boats,
  book_boat)를 붙이고 미들웨어로 HITL(book_boat), ToolCallLimit(전체 8, book_boat 1), 가드레일, 마스킹을
  건다. 실습 레포 day5_final.py·guards*.py 패턴을 따른다
- FastAPI 앱·가드레일·미들웨어·트레이싱·`async build_app()`·CLI 데모(__main__)는 모두 src/agent.py에
  둔다. 사용자가 CLAUDE.md의 '파일 하나에 역할 하나' 규칙보다 제출 폴더 규약을 우선하기로 결정했다
- 'check_condition: criteria.json thresholds로 풍속·파고가 모두 가능 상한 이하면 가능, 모두 주의 상한 이하면
  주의, 그 외 불가. advisory_rules 단계가 더 나쁘면 그 단계. 사리는 갯바위·선상의 가능→주의. 낚시 형태는 질문→Store 선호→default_type
  순이며 답변에 ''OO 기준 판정''을 쓴다. 포인트명이 모호하면 후보 최대 3곳을 돌려주고 되묻고, 없는 포인트는 고정 문구'
- 'recommend_spots: 어종·시즌(species_season)·권역·형태 필터 → 불가 제외 → 가능>주의, 동률이면 spot_id 순으로
  상위 3곳. 받은 어종·권역·형태를 Store(user_id)에 덮어쓰고 빠진 인자는 Store에서 채운다'
- 'search_regulation: data/regulations를 BM25+Chroma 하이브리드로 검색(day2 hybrid.py 패턴),
  data/chroma/가 없으면 retriever.py가 빌드. 문서에 없는 어종은 찾을 수 없다고 답한다'
- 'book_boat: 배ID·날짜·인원·이름·전화번호 필수(누락 시 도구 호출 없이 되묻기), 인원>seats_left 또는 해당 spot_id·날짜
  선상 판정 불가이면 거절, 그 외에는 예약번호만 발급하고 데이터는 바꾸지 않는다. HITL 기본 ON, EVAL_AUTO_APPROVE=true면
  자동 승인'
- 입력 가드레일은 LCEL(prompt | llm.with_structured_output(Pydantic))로 정상/범위밖/인젝션을 분류하고 범위밖·인젝션은
  서로 다른 고정 문구로 거절한다. 불가 강행은 같은 thread의 직전 check_condition 결과가 불가이고 강행 표현이 있을 때 결정적으로
  감지한다. 출력 가드레일은 search_regulation이 호출된 턴에 '참고용(실제 법령 확인 필요)'를 코드로 붙인다
- 마스킹은 이름 홍*동(2자는 홍*), 전화 010-****-5678 형식으로 answer·contexts·trace·로그에 적용한다. SQLite
  체크포인터에는 대화 재개를 위해 원문을 남긴다
- 체크포인터(thread_id)와 Store(user_id)는 모두 SQLite. /query 요청 본문은 question(필수, 공백 제외 1~500자)과
  선택 필드 thread_id, user_id. question이 없거나 비었거나 500자를 넘거나 문자열이 아니면 422
- contexts의 doc_id는 RAG 청크면 regulations/<파일명>#<청크번호>, 도구 결과면 tool:<도구명>. trace의 step은
  guardrail_input, tool:<도구명>, hitl_pending, guardrail_output, final, error 중 하나이고 input·output은
  마스킹된 문자열
- '/query의 HITL 처리: EVAL_AUTO_APPROVE=true면 book_boat를 자동 승인해 예약번호까지 진행한다. false(기본)면 book_boat
  interrupt에서 멈추고 answer에 HITL_PENDING 문구와 마스킹된 예약 요약을, trace에 step=hitl_pending을 남기며 예약은 실행하지
  않는다. /query로 승인을 재개하는 경로는 만들지 않고, 사람 승인→재개는 CLI 데모(src/agent.py __main__)에서만 제공한다. 한 번
  승인된 interrupt는 한 번만 재개되며 book_boat는 턴당 최대 1회 실행된다'
- '고정 문구는 src/agent.py 상수로 두고 아래 문자열을 그대로 쓴다.
  REFUSAL_OUT_OF_SCOPE="죄송합니다. 저는 낚시 출조(출조지 추천, 출조 가능 판정, 낚시 규정, 선상 예약)에 관한 질문만 도와드릴 수 있어요."
  / REFUSAL_INJECTION="죄송합니다. 시스템 설정이나 내부 지시에 관한 요청은 처리할 수 없어요. 낚시 출조와 관련해 궁금한 점을 물어봐 주세요."
  / UNSAFE_PUSH="해당 일정은 ''불가'' 판정이라 출조를 권하지 않습니다. 안전을 위해 다른 날짜나 포인트를 확인해 보세요."
  / ERROR_FIXED="요청을 처리하지 못했습니다. 질문을 나눠서 다시 시도해 주세요."
  / DATE_OUT_OF_RANGE="죄송합니다. 2026-11-06 ~ 2026-11-08 범위의 날씨·물때 정보만 제공할 수 있어요."
  / SPOT_NOT_FOUND="요청하신 포인트는 데이터에 없습니다. 서해·남해·동해·제주 권역의 지원 포인트 중에서 다시 물어봐 주세요."
  / REGULATION_DISCLAIMER="※ 참고용(실제 법령 확인 필요): 교육용 가상 규정 기준입니다."
  / HITL_PENDING="예약을 진행하려면 승인이 필요합니다. 아래 예약 내용을 확인해 주세요."
  / BOOKING_CANCELLED="예약 요청이 취소되었습니다."'
- '재현성과 한도: 에이전트·입력 가드레일·LLM Judge 모두 temperature=0. Bedrock 호출은 read timeout 60초, 재시도 최대 2회.
  /query 1건의 전체 처리 시간이 120초를 넘으면 ERROR_FIXED로 응답한다. 평가는 케이스당 1회 실행 결과만 채점하고 재실행해 좋은 결과를
  고르지 않는다. LLM Judge는 expected_traits 각 항목과 [판단] forbidden 각 항목에 대해 충족/위반을 JSON(Pydantic)으로
  답한다'
- run_eval.py는 build_app()을 직접 호출하고 EVAL_AUTO_APPROVE=true로 실행한다. 통과=expected_tools가
  실제 호출 도구에 포함 AND forbidden 위반 없음 AND LLM Judge가 expected_traits 전부 충족. forbidden
  중 '[판단]'으로 시작하는 항목은 LLM Judge가, 나머지는 answer·contexts·trace 문자열 포함 여부로 검사. guardrail
  건은 trace의 guardrail_input step도 확인
- 'note 칸 다턴 표기: thread=<id>, user=<id>, setup=<선행 질문>, setup_thread=<id>. setup_thread가
  있으면 setup을 그 thread에서 먼저 실행하고(장기기억 검증), 없으면 같은 thread에서 실행(단기기억 검증). ''/'' 뒤는 설명이다.
  마지막 input의 응답만 채점한다'
- RAGAS 4지표(context_recall, context_precision, faithfulness, answer_relevancy)는 Bedrock으로
  계산하고 expected_traits를 reference로 쓰며 contexts가 있는 건만 대상이다. 계산 실패 지표는 N/A와 사유를 기록하고
  통과 판정에는 쓰지 않는다
- run.sh는 pip install -r requirements.txt → data/chroma/ 없으면 빌드 → uvicorn src.agent:app
  --port 8000. Dockerfile은 python:3.11-slim, 8000 포트, 비밀은 --env-file로 주입
